<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Plus Icon -->
  <symbol id="icon-plus" stroke="currentColor" viewBox="0 0 24 24">
    <line class="iconStyle" x1="12" y1="5.5" x2="12" y2="18.5"/>
    <line class="iconStyle" x1="5.5" y1="12" x2="18.5" y2="12"/>
  </symbol>

  <!-- Critical Icon -->
  <symbol id="icon-critical" stroke="currentColor" viewBox="0 0 24 24">
    <polyline class="iconStyle" points="18.5 18.64 12 12.5 5.5 18.64"/>
    <polyline class="iconStyle" points="18.5 11.5 12 5.36 5.5 11.5"/>
  </symbol>

  <!-- High Icon -->
  <symbol id="icon-high" stroke="currentColor" viewBox="0 0 24 24">
    <polyline class="iconStyle" points="18.5 15.07 12 8.93 5.5 15.07"/>
  </symbol>

  <!-- Medium Icon -->
  <symbol id="icon-medium" stroke="currentColor" viewBox="0 0 24 24">
    <line class="iconStyle" x1="7" y1="12" x2="17" y2="12"/>
  </symbol>

  <!-- Low Icon -->
  <symbol id="icon-low" stroke="currentColor" viewBox="0 0 24 24">
    <polyline class="iconStyle" points="5.5 8.93 12 15.07 18.5 8.93"/>
  </symbol>
</svg>
